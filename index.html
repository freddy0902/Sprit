<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="Frederiks Benzinpreise" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)" />
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
<title>Frederiks Benzinpreise</title>
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png" />
<link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16.png" />
<link rel="manifest" href="manifest.webmanifest" />
<style>
:root{
  --bg:#F2F2F7;
  --card:#FFFFFF;
  --card-press:#EDEDF2;
  --label:#000000;
  --label-2:rgba(60,60,67,.60);
  --label-3:rgba(60,60,67,.30);
  --separator:rgba(60,60,67,.18);
  --blue:#007AFF;
  --green:#34C759;
  --green-bg:rgba(52,199,89,.12);
  --red:#FF3B30;
  --red-bg:rgba(255,59,48,.12);
  --gray-bg:rgba(120,120,128,.12);
  --shadow:0 1px 2px rgba(0,0,0,.04), 0 8px 24px -12px rgba(0,0,0,.18);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#000000;
    --card:#1C1C1E;
    --card-press:#2C2C2E;
    --label:#FFFFFF;
    --label-2:rgba(235,235,245,.60);
    --label-3:rgba(235,235,245,.30);
    --separator:rgba(84,84,88,.65);
    --blue:#0A84FF;
    --green:#30D158;
    --green-bg:rgba(48,209,88,.16);
    --red:#FF453A;
    --red-bg:rgba(255,69,58,.16);
    --gray-bg:rgba(120,120,128,.24);
    --shadow:none;
  }
}

*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html{height:100%;}
body{
  margin:0;
  min-height:100%;
  background:var(--bg);
  color:var(--label);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Segoe UI",system-ui,sans-serif;
  font-size:17px;
  line-height:1.4;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
  display:flex;
  justify-content:center;
  padding:
    calc(env(safe-area-inset-top,0px) + 8px)
    calc(env(safe-area-inset-right,0px) + 16px)
    calc(env(safe-area-inset-bottom,0px) + 24px)
    calc(env(safe-area-inset-left,0px) + 16px);
}

.wrap{width:100%; max-width:440px;}

/* ---------- Large title ---------- */
header{padding:12px 4px 18px;}
h1{
  margin:0;
  font-size:34px;
  line-height:41px;
  font-weight:700;
  letter-spacing:-.4px;
}
.subtitle{
  margin:2px 0 0;
  font-size:15px;
  color:var(--label-2);
  letter-spacing:-.2px;
}

/* ---------- Cards ---------- */
.cards{display:flex; flex-direction:column; gap:12px;}

.card{
  position:relative;
  background:var(--card);
  border-radius:18px;
  padding:16px 18px 15px;
  box-shadow:var(--shadow);
}

.card-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  margin-bottom:10px;
}
.name{
  font-size:17px;
  font-weight:600;
  letter-spacing:-.4px;
  display:flex;
  align-items:baseline;
  gap:6px;
  min-width:0;
}
.place{
  font-size:14px;
  font-weight:400;
  color:var(--label-2);
  letter-spacing:-.1px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.pill{
  flex-shrink:0;
  font-size:12px;
  font-weight:600;
  letter-spacing:-.05px;
  padding:4px 10px;
  border-radius:100px;
  background:var(--gray-bg);
  color:var(--label-2);
  white-space:nowrap;
  transition:background .25s ease, color .25s ease;
}
.pill[data-state="ok"]{background:var(--green-bg); color:var(--green);}
.pill[data-state="error"]{background:var(--red-bg); color:var(--red);}

.price-row{display:flex; align-items:baseline; gap:8px;}
.price{
  font-size:46px;
  line-height:1.05;
  font-weight:700;
  letter-spacing:-1.6px;
  font-variant-numeric:tabular-nums;
  font-feature-settings:"tnum" 1;
  transition:opacity .25s ease;
}
.price.loading{opacity:.22;}
.unit{
  font-size:15px;
  font-weight:500;
  color:var(--label-2);
  letter-spacing:-.2px;
}

.badge{
  display:none;
  margin-left:auto;
  font-size:12px;
  font-weight:600;
  letter-spacing:-.05px;
  color:var(--blue);
  background:rgba(0,122,255,.12);
  padding:4px 10px;
  border-radius:100px;
  white-space:nowrap;
}
@media (prefers-color-scheme: dark){ .badge{background:rgba(10,132,255,.18);} }
.card[data-cheapest="true"] .badge{display:block;}

.addr{
  margin-top:10px;
  padding-top:11px;
  border-top:.5px solid var(--separator);
  font-size:13px;
  color:var(--label-2);
  letter-spacing:-.05px;
}

/* ---------- Button ---------- */
#refresh-btn{
  appearance:none;
  -webkit-appearance:none;
  width:100%;
  margin-top:18px;
  border:0;
  border-radius:14px;
  background:var(--blue);
  color:#fff;
  font-family:inherit;
  font-size:17px;
  font-weight:600;
  letter-spacing:-.4px;
  height:50px;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  cursor:pointer;
  transition:transform .12s ease, opacity .12s ease;
}
#refresh-btn:active{transform:scale(.97); opacity:.85;}
#refresh-btn svg{width:17px; height:17px; stroke:currentColor; fill:none; stroke-width:2.2; stroke-linecap:round; stroke-linejoin:round;}
#refresh-btn .icon-check{display:none;}
#refresh-btn.spinning .icon-refresh{animation:spin .8s linear infinite;}
#refresh-btn.done{background:var(--green);}
#refresh-btn.done .icon-refresh{display:none;}
#refresh-btn.done .icon-check{display:block;}
#refresh-btn.failed{background:var(--red);}
@keyframes spin{to{transform:rotate(360deg);}}

#generated-note{
  margin:14px 0 0;
  text-align:center;
  font-size:13px;
  color:var(--label-3);
  letter-spacing:-.05px;
}

.credit{
  margin:6px 0 0;
  text-align:center;
  font-size:11px;
  color:var(--label-3);
  letter-spacing:-.02px;
}
.credit a{color:inherit; text-decoration:none; border-bottom:.5px solid var(--label-3);}

@media (prefers-reduced-motion: reduce){
  *{animation:none !important; transition:none !important;}
}
</style>
</head>
<body>
<div class="wrap">

  <header>
    <h1>Frederiks Benzinpreise</h1>
    <p class="subtitle">Super E5</p>
  </header>

  <div class="cards">

    <div class="card" id="card-dietzenbach">
      <div class="card-head">
        <div class="name">Esso<span class="place">Dietzenbach</span></div>
        <div class="pill" id="pill-dietzenbach">Lädt …</div>
      </div>
      <div class="price-row">
        <div class="price loading" id="price-dietzenbach">–,–––</div>
        <div class="unit">€/l</div>
        <div class="badge">Günstiger</div>
      </div>
      <div class="addr">Hauptstr. 7, 63128 Dietzenbach</div>
    </div>

    <div class="card" id="card-bielefeld">
      <div class="card-head">
        <div class="name">12. Mann<span class="place">Bielefeld</span></div>
        <div class="pill" id="pill-bielefeld">Lädt …</div>
      </div>
      <div class="price-row">
        <div class="price loading" id="price-bielefeld">–,–––</div>
        <div class="unit">€/l</div>
        <div class="badge">Günstiger</div>
      </div>
      <div class="addr">Jakob-Kaiser-Str. 28, 33615 Bielefeld</div>
    </div>

  </div>

  <button id="refresh-btn" aria-label="Preise neu laden">
    <svg class="icon-refresh" viewBox="0 0 24 24" aria-hidden="true">
      <path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 3v6h-6"/>
    </svg>
    <svg class="icon-check" viewBox="0 0 24 24" aria-hidden="true">
      <path d="M20 6 9 17l-5-5"/>
    </svg>
    <span id="btn-label">Neu laden</span>
  </button>

  <p id="generated-note">–</p>

  <p class="credit">Datenquelle: <a href="https://www.tankerkoenig.de/" target="_blank" rel="noopener">Tankerkönig API</a> (CC BY 4.0)</p>

</div>

<script>
const STATION_KEYS = ['dietzenbach', 'bielefeld'];

// Live-Abruf ueber den Cloudflare Worker (haelt den API-Key unter Verschluss).
const WORKER_URL   = 'https://spritpreise.frederik-loehr.workers.dev/';
// Rueckfallebene, falls der Worker nicht antwortet.
const FALLBACK_URL = 'data/prices.json';
// Letzter erfolgreicher Abruf, damit die App auch offline etwas anzeigen kann.
const CACHE_KEY    = 'benzinpreise:last';

function readCache(){
  try {
    const raw = localStorage.getItem(CACHE_KEY);
    return raw ? JSON.parse(raw) : null;
  } catch(e){ return null; }
}

function writeCache(data){
  try { localStorage.setItem(CACHE_KEY, JSON.stringify(data)); } catch(e){}
}

async function fetchJson(url){
  const res = await fetch(url + (url.includes('?') ? '&' : '?') + 't=' + Date.now(), {cache:'no-store'});
  if(!res.ok) throw new Error('HTTP ' + res.status);
  const data = await res.json();
  if(!data || !data.stations) throw new Error('Unerwartetes Format');
  return data;
}

function formatPrice(p){
  if(typeof p !== 'number' || !isFinite(p)) return '–,–––';
  return p.toLocaleString('de-DE', {minimumFractionDigits:3, maximumFractionDigits:3});
}

function setPill(key, state, text){
  const el = document.getElementById('pill-' + key);
  el.dataset.state = state;
  el.textContent = text;
}

function renderStation(key, info){
  const priceEl = document.getElementById('price-' + key);
  priceEl.classList.remove('loading');

  if(!info){
    priceEl.textContent = '–,–––';
    setPill(key, 'error', 'Keine Daten');
    return null;
  }

  if(info.status === 'open' && typeof info.e5 === 'number'){
    priceEl.textContent = formatPrice(info.e5);
    setPill(key, 'ok', 'Geöffnet');
    return info.e5;
  }

  priceEl.textContent = '–,–––';
  if(info.status === 'closed'){
    setPill(key, 'error', 'Geschlossen');
  } else {
    setPill(key, 'error', 'Kein Preis');
  }
  return null;
}

function markCheapest(prices){
  STATION_KEYS.forEach(k => document.getElementById('card-' + k).dataset.cheapest = 'false');

  const valid = STATION_KEYS.filter(k => typeof prices[k] === 'number');
  if(valid.length < 2) return;
  if(prices[valid[0]] === prices[valid[1]]) return;

  const best = valid.reduce((a, b) => prices[a] <= prices[b] ? a : b);
  document.getElementById('card-' + best).dataset.cheapest = 'true';
}

/* --- Zeitstempel: relativ ("vor 4 Min."), damit man sieht, wie frisch die Daten sind --- */
let lastGeneratedAt = null;
let lastSource = 'live';   // 'live' | 'fallback' | 'cache'

function renderGeneratedAt(){
  const note = document.getElementById('generated-note');

  if(!lastGeneratedAt){
    note.textContent = 'Noch keine Daten vorhanden.';
    return;
  }

  const d = new Date(lastGeneratedAt);
  const mins = Math.max(0, Math.round((Date.now() - d.getTime()) / 60000));

  let rel;
  if(mins < 1)        rel = 'gerade eben aktualisiert';
  else if(mins === 1) rel = 'vor 1 Minute aktualisiert';
  else if(mins < 60)  rel = 'vor ' + mins + ' Minuten aktualisiert';
  else if(mins < 120) rel = 'vor 1 Stunde aktualisiert';
  else if(mins < 1440) rel = 'vor ' + Math.floor(mins / 60) + ' Stunden aktualisiert';
  else {
    const date = d.toLocaleDateString('de-DE', {day:'2-digit', month:'2-digit'});
    const time = d.toLocaleTimeString('de-DE', {hour:'2-digit', minute:'2-digit'});
    rel = 'Stand: ' + date + ', ' + time + ' Uhr';
  }
  note.textContent = lastSource === 'live' ? rel : rel + ' · letzter bekannter Stand';
}

/* --- Button-Rückmeldung --- */
const btn = document.getElementById('refresh-btn');
const btnLabel = document.getElementById('btn-label');
let resetTimer = null;

function setButton(state){
  clearTimeout(resetTimer);
  btn.classList.remove('spinning', 'done', 'failed');

  if(state === 'loading'){
    btn.classList.add('spinning');
    btnLabel.textContent = 'Wird geladen …';
  } else if(state === 'done'){
    btn.classList.add('done');
    btnLabel.textContent = 'Aktualisiert';
    resetTimer = setTimeout(() => setButton('idle'), 1600);
  } else if(state === 'failed'){
    btn.classList.add('failed');
    btnLabel.textContent = 'Fehlgeschlagen';
    resetTimer = setTimeout(() => setButton('idle'), 2400);
  } else {
    btnLabel.textContent = 'Neu laden';
  }
}

async function loadPrices(){
  const started = Date.now();
  setButton('loading');

  STATION_KEYS.forEach(k => {
    document.getElementById('price-' + k).classList.add('loading');
    setPill(k, '', 'Lädt …');
  });

  let data = null, source = null;

  // 1. Live beim Worker fragen
  try { data = await fetchJson(WORKER_URL); source = 'live'; writeCache(data); }
  catch(e){}

  // 2. Worker nicht erreichbar: zuletzt im Repo abgelegte Preise
  if(!data){
    try { data = await fetchJson(FALLBACK_URL); source = 'fallback'; }
    catch(e){}
  }

  // 3. Gar kein Netz: was beim letzten Mal auf diesem Geraet ankam
  if(!data){
    const stored = readCache();
    if(stored){ data = stored; source = 'cache'; }
  }

  const ok = !!data;

  if(ok){
    const prices = {};
    STATION_KEYS.forEach(key => {
      prices[key] = renderStation(key, data.stations ? data.stations[key] : null);
    });
    markCheapest(prices);
    lastGeneratedAt = data.generatedAt || null;
    lastSource = source;
    renderGeneratedAt();
  } else {
    STATION_KEYS.forEach(key => {
      document.getElementById('price-' + key).classList.remove('loading');
      setPill(key, 'error', 'Fehler');
    });
    document.getElementById('generated-note').textContent = 'Preise konnten nicht geladen werden.';
  }

  // Spinner mindestens 500 ms zeigen, sonst wirkt der Tap wie ohne Wirkung
  const wait = Math.max(0, 500 - (Date.now() - started));
  setTimeout(() => setButton(ok ? 'done' : 'failed'), wait);
}

btn.addEventListener('click', loadPrices);
window.addEventListener('DOMContentLoaded', loadPrices);

// "vor X Minuten" mitlaufen lassen
setInterval(renderGeneratedAt, 30000);

// beim Zurückwechseln zur App (Home-Bildschirm-Icon) automatisch aktualisieren
document.addEventListener('visibilitychange', () => {
  if(document.visibilityState === 'visible') loadPrices();
});
</script>
</body>
</html>
